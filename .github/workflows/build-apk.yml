name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: [ApkBuilder.ps1, Start.bat, README.txt, .github/workflows/release.yml, '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the Android project
        id: find
        run: |
          S=$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then echo "No Android project found (settings.gradle[.kts]). Upload the PhotoWidgets project to this repo."; exit 1; fi
          D=$(dirname "$S"); echo "dir=$D" >> "$GITHUB_OUTPUT"; echo "Project: $D"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug --console=plain; else gradle assembleDebug --console=plain; fi

      - name: Collect APK
        run: |
          mkdir -p out
          find "${{ steps.find.outputs.dir }}" -path '*build/outputs/apk/*' -name '*.apk' -exec cp {} out/PhotoWidgets-debug.apk \;
          ls -l out; test -f out/PhotoWidgets-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoWidgets-debug-apk
          path: out/PhotoWidgets-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "photowidgets-v${{ github.run_number }}" out/PhotoWidgets-debug.apk \
            --title "PhotoWidgets build ${{ github.run_number }}" \
            --notes "Debug APK built by GitHub. Download PhotoWidgets-debug.apk on your phone and install it."
